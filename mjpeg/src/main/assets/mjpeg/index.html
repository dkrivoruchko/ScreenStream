<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<title>ScreenStream</title>
<style>* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; color: #191c20; background: #f8f9ff; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color-scheme: light dark; }
[hidden] { display: none !important; }
button, input { font: inherit; }
button { min-height: 48px; min-width: 48px; border: 1px solid #73777f; border-radius: 10px; background: #eceef4; color: #191c20; padding: 10px 14px; cursor: pointer; }
button:hover { background: #e0e2e8; }
button:disabled { opacity: .5; cursor: default; }
button:focus, input:focus, a:focus, #viewport:focus { outline: 3px solid #32628d; outline-offset: -3px; }
#shell.pointer-input #viewport:focus { outline: none; }
#shell { position: relative; width: 100%; height: 100%; overflow: hidden; background: #101418; }
#shell.access-screen, #shell.empty-screen { background-color: #f8f9ff; }
/* Measure safe edges without dynamic safe-area padding on bottom-anchored controls. */
#safe-area { position: absolute; top: 0; right: 0; bottom: 0; left: 0; top: constant(safe-area-inset-top); right: constant(safe-area-inset-right); bottom: constant(safe-area-inset-bottom); left: constant(safe-area-inset-left); top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); visibility: hidden; pointer-events: none; }
#viewport { position: absolute; top: 0; bottom: 0; left: 0; right: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
#viewport.view-fit { overflow: hidden; }
#viewport.view-width { overflow-x: hidden; overflow-y: auto; }
#image-stage { position: relative; min-width: 100%; min-height: 100%; }
/* The width stage grows with tall images; only spare vertical space is centered. */
#viewport.view-width #image-stage { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.stream-image { display: block; position: absolute; left: 50%; top: 50%; max-width: none; max-height: none; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); }
#viewport.view-width .stream-image { position: relative; left: 0; top: 0; width: 100%; height: auto; -webkit-flex: 0 0 100%; flex: 0 0 100%; -webkit-transform: none; transform: none; }
.stream-candidate { position: absolute; left: 0; top: 0; width: 0; height: 0; visibility: hidden; }
.edge { position: absolute; left: 0; right: 0; pointer-events: none; z-index: 3; }
.edge.bar { background: inherit; }
#top-bar { top: 0; }
#bottom-bar { bottom: 0; }
.block { position: absolute; z-index: 3; left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%); pointer-events: auto; max-width: 100%; opacity: 1; -webkit-transition: opacity 110ms ease 110ms, -webkit-transform 110ms ease 110ms, visibility 0s; transition: opacity 110ms ease 110ms, transform 110ms ease 110ms, visibility 0s; }
.block.autohidden { opacity: 0; visibility: hidden; pointer-events: none; -webkit-transform: translate(-50%, 8px); transform: translate(-50%, 8px); -webkit-transition-delay: 0s, 0s, 110ms; transition-delay: 0s, 0s, 110ms; }
.caption:not(.separate-bar) { -webkit-transition: opacity 110ms ease 110ms, -webkit-transform 110ms ease 110ms, top 110ms ease, bottom 110ms ease, visibility 0s; transition: opacity 110ms ease 110ms, transform 110ms ease 110ms, top 110ms ease, bottom 110ms ease, visibility 0s; }
.caption:not(.separate-bar).autohidden { -webkit-transition-delay: 0s, 0s, 0s, 0s, 110ms; transition-delay: 0s, 0s, 0s, 0s, 110ms; }
#shell.hud-hiding .caption:not(.separate-bar):not(.autohidden) { -webkit-transition-delay: 110ms, 110ms, 110ms, 110ms, 0s; transition-delay: 110ms, 110ms, 110ms, 110ms, 0s; }
.block.at-top.autohidden { -webkit-transform: translate(-50%, -8px); transform: translate(-50%, -8px); }

/* The player surfaces stay neutral over any image and browser theme. */
.caption { max-width: 95%; min-height: 36px; padding: 7px 12px; color: #fff; font-size: 14px; font-weight: 500; line-height: 24px; }
.caption span { display: block; padding: 3px 12px; border-radius: 9px; color: inherit; background: #24272b; box-shadow: 0 2px 10px rgba(0, 0, 0, .15); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.controls { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; width: -webkit-max-content; width: -moz-max-content; width: max-content; padding: 6px; border: 0; border-radius: 30px; color: #fff; background: #24272b; box-shadow: 0 4px 16px rgba(0, 0, 0, .14); }
.controls > * { margin: 0; }
.controls > button, .size-modes button + button { margin-left: 6px; }
.controls button { display: block; position: relative; -webkit-flex: 0 0 48px; flex: 0 0 48px; width: 48px; min-width: 48px; max-width: 48px; height: 48px; min-height: 48px; padding: 0; border: 0; border-radius: 8px; color: inherit; background: transparent; box-shadow: none; text-align: center; }
#view-fit { border-radius: 24px 8px 8px 24px; }
#more { border-radius: 8px 24px 24px 8px; }
.controls button svg { display: inline-block; width: 24px; height: 24px; vertical-align: middle; }
.controls button:focus { outline: none; }
.controls button[aria-pressed="true"], #more[aria-expanded="true"] { background: rgba(255, 255, 255, .18); }
.controls button:hover { background: rgba(255, 255, 255, .12); }
.controls button[aria-pressed="true"]:hover, #more[aria-expanded="true"]:hover { background: rgba(255, 255, 255, .22); }
#shell:not(.pointer-input) .controls button:focus { background: rgba(255, 255, 255, .22); }
.controls button:active { background: rgba(255, 255, 255, .22); }
.size-modes { display: -webkit-flex; display: flex; -webkit-flex-shrink: 0; flex-shrink: 0; }
.native-size { font-size: 20px; font-weight: 700; line-height: 24px; }
#fullscreen .fullscreen-exit, #fullscreen[aria-pressed="true"] .fullscreen-enter { display: none; }
#fullscreen[aria-pressed="true"] .fullscreen-exit { display: inline-block; }
.control-tooltip { position: absolute; z-index: 7; max-width: 220px; padding: 6px 10px; border-radius: 8px; color: #fff; background: #24272b; box-shadow: 0 2px 10px rgba(0, 0, 0, .2); font-size: 12px; line-height: 18px; pointer-events: none; white-space: normal; text-align: center; overflow-wrap: break-word; word-wrap: break-word; }

/* Separate bars retain the configured background and matching foreground. */
.caption.separate-bar { width: 100%; max-width: 100%; text-align: center; }
.block.separate-bar { color: #fff; background: transparent; border: 0; border-radius: 0; box-shadow: none; }
#shell.dark-bar-text .block.separate-bar { color: #000; }
.caption.separate-bar span { background: transparent; border: 0; border-radius: 0; box-shadow: none; color: inherit; }
.controls.separate-bar { width: 100%; max-width: 100%; }
.controls.separate-bar #view-fit, .controls.separate-bar #more { border-radius: 8px; }
#shell.dark-bar-text .controls.separate-bar button[aria-pressed="true"], #shell.dark-bar-text .controls.separate-bar button[aria-expanded="true"] { background: rgba(0, 0, 0, .12); }
#shell.dark-bar-text .controls.separate-bar button:hover { background: rgba(0, 0, 0, .08); }
#shell.dark-bar-text .controls.separate-bar button[aria-pressed="true"]:hover, #shell.dark-bar-text .controls.separate-bar button[aria-expanded="true"]:hover { background: rgba(0, 0, 0, .16); }
#shell.dark-bar-text:not(.pointer-input) .controls.separate-bar button:focus, #shell.dark-bar-text .controls.separate-bar button:active { background: rgba(0, 0, 0, .22); }

/* Empty-state bars follow the neutral canvas rather than the configured image background. */
#shell.empty-screen .block.separate-bar { color: #191c20; }
#shell.empty-screen .controls.separate-bar button[aria-pressed="true"], #shell.empty-screen .controls.separate-bar button[aria-expanded="true"] { background: rgba(128, 128, 128, .18); }
#shell.empty-screen .controls.separate-bar button:hover { background: rgba(128, 128, 128, .12); }
#shell.empty-screen .controls.separate-bar button[aria-pressed="true"]:hover, #shell.empty-screen .controls.separate-bar button[aria-expanded="true"]:hover { background: rgba(128, 128, 128, .22); }
#shell.empty-screen:not(.pointer-input) .controls.separate-bar button:focus, #shell.empty-screen .controls.separate-bar button:active { background: rgba(128, 128, 128, .22); }

.status-panel { width: 100%; text-align: center; }
.status-overlay { position: absolute; z-index: 4; width: 360px; padding: 12px; overflow: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; color: #fff; background: #24272b; box-shadow: 0 2px 10px rgba(0, 0, 0, .2); -webkit-transform: translateX(-50%); transform: translateX(-50%); -webkit-transition: bottom 110ms ease; transition: bottom 110ms ease; }
#shell.hud-hiding .status-overlay { -webkit-transition-delay: 110ms; transition-delay: 110ms; }
.status-overlay.status-compact { width: 280px; width: -webkit-max-content; width: -moz-max-content; width: max-content; padding: 7px 12px; }
.status-overlay #state-message { color: inherit; font-size: 15px; line-height: 1.4; }
.status-panel.status-failed #state-message { color: #ffb4ab; }
#shell.menu-open #status-panel { visibility: hidden; pointer-events: none; }
.recovery { width: 100%; }
.recovery button { display: block; width: 100%; margin-top: 8px; }
.panel { position: absolute; z-index: 6; left: 50%; width: 360px; max-width: 96%; max-height: 80%; margin-left: -180px; padding: 20px; overflow: auto; -webkit-overflow-scrolling: touch; border: 1px solid #73777f; border-radius: 15px; background: #e6e8ee; box-shadow: 0 16px 64px rgba(0, 0, 0, .3); }
.panel button { display: block; width: 100%; margin-top: 8px; }
#menu { width: 344px; margin-left: -172px; padding: 14px; border: 0; border-radius: 14px; color: #fff; background: #24272b; color-scheme: dark; box-shadow: 0 12px 40px rgba(0, 0, 0, .3); }
#menu:focus { outline: none; }
.menu-heading { margin: 16px 8px 4px; color: #fff; font-size: 14px; font-weight: 500; line-height: 20px; }
#method-label { margin-top: 0; margin-bottom: 8px; }
.method-choices { margin-bottom: 14px; }
#menu .method-choices button { display: block; position: relative; width: 100%; min-height: 48px; margin: 4px 0; padding: 10px 38px 10px 10px; border: 0; border-radius: 12px; color: inherit; background: transparent; text-align: left; white-space: normal; }
.method-title, .method-description { display: block; }
.method-title { font-size: 14px; font-weight: 500; line-height: 20px; }
.method-description { margin-top: 2px; color: #ccc; font-size: 12px; line-height: 17px; }
.method-check { position: absolute; right: 12px; top: 50%; width: 18px; height: 18px; margin-top: -9px; visibility: hidden; }
#menu .method-choices button[aria-pressed="true"] .method-check { visibility: visible; }
#menu .method-choices button:hover { background: rgba(255, 255, 255, .12); }
#menu .method-choices button[aria-pressed="true"] { background: rgba(255, 255, 255, .18); }
#menu .method-choices button[aria-pressed="true"]:hover { background: rgba(255, 255, 255, .22); }
#menu button:focus { outline: none; }
#shell:not(.pointer-input) #menu button:focus, #menu .method-choices button:active { background: rgba(255, 255, 255, .22); }
.information-list { margin: 6px 8px 0; overflow: hidden; }
.information-list dt { float: left; clear: left; width: 86px; margin: 0; padding: 6px 0; color: #bdbdbd; font-size: 12px; line-height: 20px; }
.information-list dd { min-height: 32px; margin: 0 0 0 96px; padding: 6px 0; color: #fff; font-size: 13px; line-height: 20px; overflow-wrap: break-word; word-wrap: break-word; }
.legal-links { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: center; justify-content: center; margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, .14); }
.legal-links a { display: inline-block; min-height: 36px; margin: 0 9px; padding: 8px 0; color: #c8c8c8; font-size: 12px; line-height: 20px; text-decoration: underline; white-space: nowrap; }
.legal-links a:hover { color: #fff; }
.legal-links a:focus { outline: 2px solid #fff; outline-offset: 3px; border-radius: 2px; }

/* Keep physical image coordinates LTR; mirror only the surrounding viewer UI. */
[dir="rtl"] .controls > button, [dir="rtl"] .size-modes button + button { margin-left: 0; margin-right: 6px; }
[dir="rtl"] #view-fit { border-radius: 8px 24px 24px 8px; }
[dir="rtl"] #more { border-radius: 24px 8px 8px 24px; }
[dir="rtl"] #menu .method-choices button { padding: 10px 10px 10px 38px; text-align: right; }
[dir="rtl"] .method-check { left: 12px; right: auto; }
[dir="rtl"] .information-list dt { float: right; clear: right; }
[dir="rtl"] .information-list dd { margin: 0 96px 0 0; }
[dir="rtl"] #info-size { text-align: right; }

/* Keep a readable dark backing even when blur is unavailable or the image is white. */
.controls:not(.separate-bar), .caption:not(.separate-bar) span, .status-overlay { background: rgba(24, 27, 31, .8); }
@supports ((-webkit-backdrop-filter: blur(10px)) or (backdrop-filter: blur(10px))) {
  .controls:not(.separate-bar), .caption:not(.separate-bar) span, .status-overlay { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
}
@media (prefers-reduced-motion: reduce) {
  .block, .block.autohidden, .caption:not(.separate-bar), .status-overlay { -webkit-transition: none; transition: none; }
}

/* Access and no-image states keep the system palette. */
.open-state, #pin-panel { position: absolute; top: 50%; left: 50%; width: 392px; max-width: calc(100% - 32px); max-height: calc(100% - 32px); margin-left: 0; padding: 16px 12px; overflow: auto; text-align: center; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); }
.open-state { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; }
.open-state > * { -webkit-flex-shrink: 0; flex-shrink: 0; }
.open-content { width: 100%; min-width: 0; }
.open-actions { width: 100%; max-width: 320px; margin: 0 auto; }
.open-state .recovery { margin-top: 16px; }
.open-state .recovery button:first-child { margin-top: 0; }
#state-message { margin: 0; color: #526070; font-size: 16px; line-height: 1.6; }
.open-state .status-panel.status-failed #state-message { color: #ba1a1a; }
#pin-panel { border: 0; border-radius: 0; color: inherit; background: transparent; box-shadow: none; }
/* Leave 264px for compact PIN content and outer insets. */
#pin-logo, #state-logo { display: block; width: 192px; min-width: 40px; max-width: 192px; height: auto; margin: 0 auto 24px; }
#state-logo { margin-bottom: 16px; }
#pin-title { margin: 0; font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
#pin-form { width: 100%; max-width: 320px; margin: 0 auto; }
#pin-panel p { margin: 16px 0 26px; color: #526070; font-size: 16px; line-height: 1.6; }
#pin-block-copy { white-space: pre-line; }
#pin-entry { margin-top: 26px; }
#pin-entry label { display: block; margin-bottom: 12px; color: #526070; font-size: 16px; line-height: 1.5; }
#pin { display: block; width: 100%; min-height: 56px; margin: 0; padding: 10px 16px; border: 1px solid #73777f; border-radius: 10px; color: #191c20; background: #fff; font: 26px Menlo, Consolas, monospace; letter-spacing: .18em; text-align: center; }
#pin-panel #pin-error { margin: 8px 0 0; color: #ba1a1a; font-size: 14px; line-height: 1.5; }
#unlock { min-height: 50px; margin-top: 16px; border-radius: 10px; background: #32628d; border-color: #32628d; color: #fff; font-size: 15px; font-weight: 600; }
#unlock:focus { outline-color: #fff; }
#pin-retry { width: 100%; max-width: 320px; min-height: 48px; margin: 12px auto 0; background: transparent; color: inherit; }
#pin-countdown { margin-top: 28px; }
#pin-countdown-value { display: block; margin-top: 0; font: 500 40px Menlo, Consolas, monospace; line-height: 48px; letter-spacing: -.03em; }
#pip-video { position: absolute; width: 1px; height: 1px; left: 0; bottom: 0; opacity: .01; pointer-events: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
@media (max-width: 380px) {
  .controls > button, .size-modes button + button { margin-left: 3px; }
  [dir="rtl"] .controls > button, [dir="rtl"] .size-modes button + button { margin-right: 3px; }
  .panel, #menu { left: 2%; margin-left: 0; width: 96%; }
  button { padding: 8px 6px; }
}
@media (max-width: 600px) {
  .caption { max-width: calc(100% - 16px); }
  #pin-logo, #state-logo { max-width: 154px; }
}
@media (max-height: 600px) {
  #pin-panel, .open-state { padding: 8px; }
  #pin-logo { margin-bottom: 8px; }
  #pin-title { font-size: 26px; }
  #pin-entry label { margin-bottom: 8px; font-size: 14px; line-height: 1.4; }
  #unlock { margin-top: 12px; }
  #pin-panel p { margin: 12px 0 16px; font-size: 14px; line-height: 1.5; }
  #pin-entry { margin-top: 8px; }
}
@media (max-height: 400px) {
  .panel { max-height: 90%; }
  .caption, .controls { padding-top: 2px; padding-bottom: 2px; }
}
@media (prefers-color-scheme: dark) {
  html, body { color: #e0e2e8; background: #101418; }
  #shell.access-screen, #shell.empty-screen { background-color: #101418; }
  #shell.empty-screen .block.separate-bar { color: #e0e2e8; }
  #state-message { color: #c2c7cf; }
  .open-state .status-panel.status-failed #state-message { color: #ffb4ab; }
  button { background: #1d2024; border-color: #8c9199; color: #e0e2e8; }
  button:hover { background: #32353a; }
  button:focus, input:focus, a:focus, #viewport:focus { outline-color: #9dcafc; }
  .panel { background: #272a2f; border-color: #8c9199; }
  #pin { background: #191c20; border-color: #8c9199; color: #e0e2e8; }
  #pin-panel #pin-error { color: #ffb4ab; }
  #pin-panel p, #pin-entry label { color: #c2c7cf; }
  #unlock { background: #9dcafc; border-color: #9dcafc; color: #003355; }
  #unlock:focus { outline-color: #003355; }
}
</style>
</head>
<body>
<main id="shell" class="access-screen" aria-label="ScreenStream viewer" data-a11y="viewerLabel">
  <div id="safe-area" aria-hidden="true"></div>
  <div id="top-bar" class="edge bar"></div>
  <div id="viewport" tabindex="0" dir="ltr" aria-label="Stream image. Use arrow keys to scroll." data-a11y="viewportLabel">
    <div id="image-stage"></div>
    <section id="placeholder" class="open-state" data-locale-dir>
      <img id="state-logo" width="192" height="192" alt="" aria-hidden="true" hidden>
      <div id="status-panel" class="status-panel" data-locale-dir>
        <div class="open-content"><p id="state-message" role="status" aria-live="polite"></p></div>
        <div class="open-actions">
          <div id="recovery" class="recovery" hidden>
            <button id="recovery-retry" type="button" data-word="retry"></button>
            <button id="recovery-alternate" type="button" data-word="useJpeg"></button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div id="bottom-bar" class="edge bar"></div>
  <div id="caption" class="block caption" dir="auto" hidden><span id="caption-text" dir="auto"></span></div>
  <!-- Material Icons SVG paths: google/material-design-icons, Apache 2.0. Fit to width uses a custom path. -->
  <div id="controls" class="block controls" role="group" aria-label="Viewing controls" data-a11y="controlsLabel" hidden>
    <div class="size-modes" role="group" aria-label="Image size" data-a11y="sizeModesLabel">
      <button id="view-fit" type="button" aria-pressed="true" data-label="fit">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M17 4h3c1.1 0 2 .9 2 2v2h-2V6h-3V4zM4 8V6h3V4H4c-1.1 0-2 .9-2 2v2h2zm16 8v2h-3v2h3c1.1 0 2-.9 2-2v-2h-2zM7 18H4v-2H2v2c0 1.1.9 2 2 2h3v-2zM18 8H6v8h12V8z"/></svg>
      </button>
      <button id="view-original" type="button" aria-pressed="false" data-label="original"><span class="native-size" dir="ltr" aria-hidden="true">1:1</span></button>
      <button id="view-width" type="button" aria-pressed="false" data-label="width">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M3 5v14M21 5v14M5 12h14M8 9l-3 3 3 3M16 9l3 3-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <button id="fullscreen" type="button" aria-pressed="false" data-label="fullscreen" hidden>
      <svg class="fullscreen-enter" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      <svg class="fullscreen-exit" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
    </button>
    <button id="pip" type="button" data-label="pip" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
    </button>
    <button id="more" type="button" aria-expanded="false" aria-controls="menu" data-label="more">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </button>
  </div>
  <div id="control-tooltip" class="control-tooltip" aria-hidden="true" hidden></div>
  <section id="menu" class="panel" role="region" aria-label="More viewing options" data-a11y="menuLabel" tabindex="-1" hidden>
