<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="same-origin">
<title>ScreenStream</title>
<style>* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; color: #fff; background: #101418; font: 16px Arial, sans-serif; }
[hidden] { display: none !important; }
button, select, input { font: inherit; }
button, select { min-height: 48px; min-width: 48px; border: 1px solid #8e969f; border-radius: 4px; background: #232b33; color: #fff; padding: 8px 12px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button:focus, select:focus, input:focus, #viewport:focus { outline: 3px solid #8fc8ff; outline-offset: -3px; }
#shell { position: relative; width: 100%; height: 100%; overflow: hidden; background: #101418; }
#viewport { position: absolute; top: 0; bottom: 0; left: 0; right: 0; left: constant(safe-area-inset-left); right: constant(safe-area-inset-right); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); overflow: auto; -webkit-overflow-scrolling: touch; }
#image-stage { position: relative; min-width: 100%; min-height: 100%; }
.stream-image { display: block; position: absolute; max-width: none; max-height: none; }
#placeholder { position: absolute; top: 45%; left: 10%; width: 80%; text-align: center; line-height: 1.5; pointer-events: none; }
.edge { position: absolute; left: 0; right: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; pointer-events: none; z-index: 3; }
.edge.bar { background: #181e24; }
#top-bar { top: 0; padding-top: 4px; padding-top: constant(safe-area-inset-top); padding-top: env(safe-area-inset-top, 4px); }
#bottom-bar { bottom: 0; padding-bottom: 4px; padding-bottom: constant(safe-area-inset-bottom); padding-bottom: env(safe-area-inset-bottom, 4px); }
.block { position: absolute; z-index: 3; left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%); pointer-events: auto; max-width: 100%; padding: 4px; padding-left: constant(safe-area-inset-left); padding-right: constant(safe-area-inset-right); padding-left: env(safe-area-inset-left, 4px); padding-right: env(safe-area-inset-right, 4px); }
.block.autohidden { visibility: hidden; pointer-events: none; }
.caption { max-width: 95%; min-height: 32px; line-height: 24px; }
.caption span { display: block; background: rgba(20, 26, 32, .9); padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.caption.separate-bar { width: 100%; max-width: 100%; text-align: center; }
.controls { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
.controls > * { margin: 0 2px; }
.mode-label { display: block; min-width: 0; }
.mode-label select { max-width: 100%; }
.status { position: absolute; z-index: 4; left: 10%; width: 80%; text-align: center; pointer-events: none; line-height: 1.4; font-size: 14px; padding: 4px; background: rgba(16, 20, 24, .85); }
.status:empty { display: none; }
.panel { position: absolute; z-index: 6; left: 50%; width: 360px; max-width: 96%; max-height: 80%; margin-left: -180px; padding: 16px; overflow: auto; -webkit-overflow-scrolling: touch; border: 1px solid #8e969f; border-radius: 6px; background: #1c232b; box-shadow: 0 4px 18px #000; }
.panel button { display: block; width: 100%; margin-top: 8px; }
#menu { bottom: 68px; }
.check { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; min-height: 48px; cursor: pointer; }
.check input { width: 24px; height: 24px; margin: 0 12px 0 0; }
.pin-panel { top: 10%; }
.pin-panel input { display: block; width: 100%; min-height: 48px; margin-top: 8px; font-size: 24px; padding: 8px; color: #111; background: #fff; }
.pin-panel p { line-height: 1.5; }
.recovery { top: 35%; }
h2 { font-size: 18px; margin: 12px 0; }
dl { margin: 8px 0; }
dt { color: #bdc7d1; margin-top: 8px; font-size: 14px; }
dd { margin-left: 0; overflow-wrap: break-word; word-wrap: break-word; }
#pip-video { position: absolute; width: 1px; height: 1px; left: 0; bottom: 0; opacity: .01; pointer-events: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
@media (max-width: 380px) { .panel { left: 2%; margin-left: 0; width: 96%; } .controls { width: 100%; } button, select { padding: 8px 6px; } .controls button { font-size: 13px; } }
@media (max-width: 600px) {
  .controls { width: 100%; max-width: 420px; }
  .mode-label { -webkit-flex: 1; flex: 1; }
  .mode-label select { width: 100%; }
  .controls #fullscreen, .controls #pip, .controls #more { font-size: 0; -webkit-flex-shrink: 0; flex-shrink: 0; }
  #fullscreen::before { content: '\26F6'; font-size: 24px; }
  #pip::before { content: '\25A3'; font-size: 24px; }
  #more::before { content: '\2022\2022\2022'; font-size: 18px; }
}
@media (max-height: 400px) { .panel { max-height: 90%; } .pin-panel { top: 3%; } #menu { max-height: 70%; } .block { padding-top: 2px; padding-bottom: 2px; } }
</style>
</head>
<body>
<main id="shell" aria-label="ScreenStream viewer">
  <div id="top-bar" class="edge bar"></div>
  <div id="viewport" tabindex="0" aria-label="Stream image. Use arrow keys to scroll.">
    <div id="image-stage"></div>
    <div id="placeholder" role="status">Connecting…</div>
  </div>
  <div id="bottom-bar" class="edge bar"></div>
  <div id="caption" class="block caption" hidden><span id="caption-text"></span></div>
  <div id="controls" class="block controls" role="toolbar" aria-label="Viewing controls" hidden>
    <label class="mode-label"><span class="sr-only" data-word="viewMode"></span>
      <select id="view-mode" aria-label="Image size">
        <option value="fit" data-word="fit"></option>
        <option value="original" data-word="original"></option>
        <option value="width" data-word="width"></option>
      </select>
    </label>
    <button id="fullscreen" type="button" hidden data-word="fullscreen"></button>
    <button id="pip" type="button" hidden data-word="pip"></button>
    <button id="more" type="button" aria-expanded="false" aria-controls="menu" data-word="more"></button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <section id="menu" class="panel" role="dialog" aria-label="More viewing options" hidden>
    <label class="check"><input id="show-info" type="checkbox"><span data-word="infoToggle"></span></label>
    <div id="information" hidden>
      <h2 data-word="info"></h2>
      <dl>
        <dt data-word="method"></dt><dd id="info-method"></dd>
        <dt data-word="connection"></dt><dd id="info-connection"></dd>
        <dt data-word="image"></dt><dd id="info-image"></dd>
        <dt data-word="capture"></dt><dd id="info-capture"></dd>
        <dt data-word="size"></dt><dd id="info-size"></dd>
        <dt data-word="title"></dt><dd id="info-title"></dd>
      </dl>
    </div>
    <button id="retry" type="button" data-word="retry"></button>
    <button id="alternate" type="button" data-word="alternate"></button>
    <button id="close-menu" type="button" data-word="close"></button>
  </section>
  <section id="pin-panel" class="panel pin-panel" aria-label="Stream access" hidden>
    <form id="pin-form" method="post" action="/pin">
      <p id="pin-message" role="status" aria-live="polite"></p>
      <label for="pin" data-word="pinLabel"></label>
      <input id="pin" name="pin" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off" autocapitalize="off" required aria-describedby="pin-message">
      <button id="unlock" type="submit" data-word="unlock"></button>
    </form>
    <button id="pin-retry" type="button" data-word="retry"></button>
  </section>
  <div id="recovery" class="panel recovery" hidden>
    <button id="recovery-retry" type="button" data-word="retry"></button>
    <button id="recovery-alternate" type="button" data-word="alternate"></button>
  </div>
  <video id="pip-video" muted playsinline aria-hidden="true"></video>
  <noscript><p class="panel">Enable JavaScript to view this stream and enter its PIN.</p></noscript>
</main>
